<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroneAI - Simple Flight Command</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(15, 23, 42, 0.85);
            --bg-card-hover: rgba(30, 41, 59, 0.92);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
        }

        /* Fullscreen Map */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Header Bar */
        .top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .brand-pill {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 8px 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand-pill .logo {
            font-size: 1.3rem;
        }

        .brand-pill .title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-sub);
            border: 1px solid var(--border-glass);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .status-badge.disarmed {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }

        .status-badge.ready {
            background: rgba(56, 189, 248, 0.18);
            color: var(--accent-blue);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .status-badge.flying {
            background: rgba(16, 185, 129, 0.18);
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .status-badge.returning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .status-badge.warning {
            background: rgba(239, 68, 68, 0.22);
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.5);
            animation: pulse-red 1s infinite;
        }

        .top-actions {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .map-style-btn {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 9px 15px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .map-style-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-blue);
        }

        /* Floating Telemetry HUD */
        .telemetry-bar {
            position: absolute;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 10px 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .telem-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .telem-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .telem-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .telem-divider {
            width: 1px;
            height: 22px;
            background: var(--border-glass);
        }

        /* Low battery pulsing effect */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 24px rgba(239, 68, 68, 0.6); }
        }

        .low-battery-alert {
            animation: pulse-red 1.2s infinite;
            border-color: rgba(239, 68, 68, 0.8) !important;
        }

        /* Bottom Floating Control Center */
        .bottom-card {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            max-width: 95vw;
            pointer-events: auto;
        }

        /* Presets selection row (Altitude & Speed) */
        .presets-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .preset-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-label {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-right: 2px;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-chip:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }

        .preset-chip.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(99, 102, 241, 0.38));
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
        }

        .hint-text {
            font-size: 0.82rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Primary Action: Launch */
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        /* Pause / Resume Button */
        .btn-pause {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
        }

        .btn-pause:hover:not(:disabled) {
            background: rgba(148, 163, 184, 0.25);
            color: white;
        }

        .btn-pause.active-pause {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        }

        /* Return to Home Button */
        .btn-warning {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            background: linear-gradient(135deg, #b45309, #d97706);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-1px);
        }

        /* Land Button */
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.25);
            color: white;
        }

        /* Clear Button */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }

        /* Custom Markers */
        .waypoint-pin {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .waypoint-pin:hover {
            transform: scale(1.15);
        }

        .waypoint-pin.reached {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.7);
        }

        .home-marker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.95);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
        }

        .drone-marker {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);
            transition: transform 0.2s ease;
        }

        /* Toast notification */
        .toast {
            position: absolute;
            top: 135px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 9px 18px;
            font-size: 0.85rem;
            color: var(--text-main);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="brand-pill">
            <span class="logo">🛸</span>
            <span class="title">DroneAI</span>
            <div class="status-badge disarmed" id="flight-status-badge">
                <span class="status-dot"></span>
                <span id="flight-status-text">DISARMED</span>
            </div>
        </div>

        <div class="top-actions">
            <button class="map-style-btn" id="map-style-btn" onclick="cycleMapStyle()">
                <span id="map-style-icon">🛰️</span>
                <span id="map-style-text">Satellite (Esri)</span>
            </button>
        </div>
    </div>

    <!-- Floating Telemetry HUD (Includes Distance & ETA) -->
    <div class="telemetry-bar">
        <div class="telem-item">
            <span class="telem-label">Battery</span>
            <span class="telem-val" id="hud-battery">100%</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">Altitude</span>
            <span class="telem-val" id="hud-altitude">0.0 m</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">Speed</span>
            <span class="telem-val" id="hud-speed">0.0 m/s</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">Distance</span>
            <span class="telem-val" id="hud-distance">0.0 km</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">Est. Time</span>
            <span class="telem-val" id="hud-eta">0m 00s</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">GPS Fix</span>
            <span class="telem-val" id="hud-satellites">10 Sats (3D)</span>
        </div>
        <div class="telem-divider"></div>
        <div class="telem-item">
            <span class="telem-label">Destinations</span>
            <span class="telem-val" id="hud-waypoints">0 points</span>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast-msg"></div>

    <!-- Bottom Action Card -->
    <div class="bottom-card">
        <!-- Altitude & Speed Presets -->
        <div class="presets-row">
            <div class="preset-group">
                <span class="preset-label">Altitude:</span>
                <button class="preset-chip alt-chip" data-alt="20" onclick="setAltitudePreset(20)">20m</button>
                <button class="preset-chip alt-chip active" data-alt="30" onclick="setAltitudePreset(30)">30m</button>
                <button class="preset-chip alt-chip" data-alt="50" onclick="setAltitudePreset(50)">50m</button>
                <button class="preset-chip alt-chip" data-alt="100" onclick="setAltitudePreset(100)">100m</button>
            </div>

            <div class="preset-group">
                <span class="preset-label">Speed:</span>
                <button class="preset-chip speed-chip active" data-speed="1" onclick="setSpeedPreset(1)">1x</button>
                <button class="preset-chip speed-chip" data-speed="2" onclick="setSpeedPreset(2)">2x</button>
                <button class="preset-chip speed-chip" data-speed="5" onclick="setSpeedPreset(5)">5x</button>
            </div>
        </div>

        <div class="hint-text" id="status-hint">
            <span>👉</span> <span id="hint-msg">Click anywhere on the map to set destination points.</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="btn-start" onclick="flyToLocations()">
                <span>🚀</span> <span>Fly to Locations</span>
            </button>

            <button class="btn btn-pause" id="btn-pause" onclick="togglePauseMission()" disabled>
                <span>⏸️</span> <span>Pause</span>
            </button>

            <button class="btn btn-warning" id="btn-rth" onclick="returnToHome()" disabled>
                <span>🏠</span> <span>Return to Home</span>
            </button>

            <button class="btn btn-danger" id="btn-land" onclick="landNow()" disabled>
                <span>🛬</span> <span>Land</span>
            </button>

            <button class="btn btn-secondary" id="btn-clear" onclick="clearPoints()">
                <span>🗑️</span> <span>Clear Points</span>
            </button>
        </div>
    </div>

    <script>
        // Connect to backend via WebSocket
        const socket = io();

        // 100% Free & Open-Source Map Layers (No API Keys Required)
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; High-Res Aerial',
            maxZoom: 19
        });

        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: 'Map: OpenStreetMap | Contours: OpenTopoMap',
            maxZoom: 17
        });

        const mapStyles = [
            { id: 'satellite', layer: satelliteLayer, name: 'Satellite (Esri)', icon: '🛰️' },
            { id: 'street', layer: streetLayer, name: 'Streets (OSM)', icon: '🗺️' },
            { id: 'topo', layer: topoLayer, name: 'Topographic', icon: '⛰️' }
        ];

        let currentMapStyleIdx = 0;

        // Initialize Map (Default centered on drone home)
        const HOME_COORDS = [42.3803, 20.4308];
        const map = L.map('map', { zoomControl: false }).setView(HOME_COORDS, 15);

        // Position zoom controls in bottom-left
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Default to Satellite
        satelliteLayer.addTo(map);

        // Layer cycling function
        function cycleMapStyle() {
            map.removeLayer(mapStyles[currentMapStyleIdx].layer);
            currentMapStyleIdx = (currentMapStyleIdx + 1) % mapStyles.length;
            const current = mapStyles[currentMapStyleIdx];
            current.layer.addTo(map);

            document.getElementById('map-style-icon').textContent = current.icon;
            document.getElementById('map-style-text').textContent = current.name;
        }

        // State Tracking
        let isSimRunning = false;
        let isArmed = false;
        let isFlying = false;
        let isReturning = false;
        let isLanding = false;
        let isPaused = false;
        let lowBatteryTriggered = false;
        let selectedAltitude = 30.0;
        let currentSpeedMultiplier = 1.0;

        let waypoints = []; // [{seq, lat, lng, alt, marker, reached}]
        let missionLine = null;
        let latestDronePosition = null;

        // Custom Marker Icons
        const homeIcon = L.divIcon({
            className: 'home-icon-wrap',
            html: '<div class="home-marker">🏠</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        const droneIcon = L.divIcon({
            className: 'drone-icon-wrap',
            html: '<div class="drone-marker" id="drone-icon-el">✈</div>',
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        // Add Home Marker
        const homeMarker = L.marker(HOME_COORDS, { icon: homeIcon }).addTo(map);
        homeMarker.bindPopup('<b>Home Base</b><br>Takeoff & RTH location');

        // Add Drone Marker
        const droneMarker = L.marker(HOME_COORDS, { icon: droneIcon, zIndexOffset: 1000 }).addTo(map);

        // Haversine Distance Calculation (meters)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Mission Metrics: Update Total Distance & ETA
        function updateMissionMetrics() {
            if (waypoints.length === 0) {
                document.getElementById('hud-distance').textContent = '0.0 km';
                document.getElementById('hud-eta').textContent = '0m 00s';
                return;
            }

            let totalMeters = 0;
            if (!isFlying) {
                // Planned Route: Home -> WP1 -> WP2...
                let prev = { lat: HOME_COORDS[0], lng: HOME_COORDS[1] };
                for (const wp of waypoints) {
                    totalMeters += calculateDistance(prev.lat, prev.lng, wp.lat, wp.lng);
                    prev = wp;
                }
            } else {
                // Live Route: Current Position -> unreached waypoints -> Home (if returning)
                let startPos = latestDronePosition || { lat: HOME_COORDS[0], lng: HOME_COORDS[1] };
                if (isReturning) {
                    totalMeters = calculateDistance(startPos.lat, startPos.lng, HOME_COORDS[0], HOME_COORDS[1]);
                } else {
                    let unreached = waypoints.filter(wp => !wp.reached);
                    if (unreached.length > 0) {
                        let prev = startPos;
                        for (const wp of unreached) {
                            totalMeters += calculateDistance(prev.lat, prev.lng, wp.lat, wp.lng);
                            prev = wp;
                        }
                    }
                }
            }

            // Format Distance
            let distStr = totalMeters >= 1000 ? `${(totalMeters / 1000).toFixed(2)} km` : `${Math.round(totalMeters)} m`;
            document.getElementById('hud-distance').textContent = distStr;

            // Format ETA (Cruise base ~12 m/s * multiplier)
            const cruiseSpeed = 12.0 * currentSpeedMultiplier;
            const seconds = totalMeters > 0 ? Math.round(totalMeters / cruiseSpeed) : 0;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('hud-eta').textContent = `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
        }

        // Map Click: Add Waypoint
        map.on('click', function(e) {
            if (isFlying) {
                showToast('Flight in progress. Waypoints locked.', 'warning');
                return;
            }

            const seq = waypoints.length + 1;
            const marker = L.marker([e.latlng.lat, e.latlng.lng], {
                icon: L.divIcon({
                    className: 'wp-icon-wrap',
                    html: `<div class="waypoint-pin" id="wp-pin-${seq}">${seq}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                }),
                draggable: true
            }).addTo(map);

            const wpData = {
                seq: seq,
                lat: e.latlng.lat,
                lng: e.latlng.lng,
                alt: selectedAltitude,
                marker: marker,
                reached: false
            };

            marker.on('dragend', function(evt) {
                const pos = evt.target.getLatLng();
                wpData.lat = pos.lat;
                wpData.lng = pos.lng;
                redrawFlightPath();
                updateMissionMetrics();
            });

            waypoints.push(wpData);
            redrawFlightPath();
            updateWaypointCountUI();
            updateMissionMetrics();
            setHint(`Point ${seq} added! Add more points or click "Fly to Locations".`);
        });

        // Redraw dashed path connecting waypoints
        function redrawFlightPath() {
            if (missionLine) {
                map.removeLayer(missionLine);
            }
            if (waypoints.length === 0) return;

            const coords = [HOME_COORDS, ...waypoints.map(w => [w.lat, w.lng])];
            missionLine = L.polyline(coords, {
                color: '#38bdf8',
                weight: 3,
                opacity: 0.85,
                dashArray: '8, 6'
            }).addTo(map);
        }

        // Update waypoint count on HUD
        function updateWaypointCountUI() {
            document.getElementById('hud-waypoints').textContent = `${waypoints.length} point${waypoints.length === 1 ? '' : 's'}`;
        }

        // Preset: Set Target Cruise Altitude
        function setAltitudePreset(alt) {
            selectedAltitude = parseFloat(alt);
            document.querySelectorAll('.alt-chip').forEach(c => {
                c.classList.toggle('active', parseFloat(c.dataset.alt) === selectedAltitude);
            });
            waypoints.forEach(wp => {
                if (!wp.reached) wp.alt = selectedAltitude;
            });
            socket.emit('set_altitude', { altitude: selectedAltitude });
            showToast(`Cruise Altitude: ${selectedAltitude}m`);
            if (isFlying) {
                setHint(`Adjusting target altitude to ${selectedAltitude}m...`);
            }
        }

        // Preset: Set Simulation Speed
        function setSpeedPreset(speed) {
            currentSpeedMultiplier = parseFloat(speed);
            document.querySelectorAll('.speed-chip').forEach(c => {
                c.classList.toggle('active', parseFloat(c.dataset.speed) === currentSpeedMultiplier);
            });
            socket.emit('set_speed', { speed: currentSpeedMultiplier });
            showToast(`Simulation Speed: ${currentSpeedMultiplier}x`);
            updateMissionMetrics();
        }

        // Clear Points
        function clearPoints() {
            if (isFlying) {
                showToast('Cannot clear waypoints while flying!', 'error');
                return;
            }
            waypoints.forEach(wp => map.removeLayer(wp.marker));
            waypoints = [];
            if (missionLine) {
                map.removeLayer(missionLine);
                missionLine = null;
            }
            updateWaypointCountUI();
            updateMissionMetrics();
            setHint('Points cleared. Click on the map to set new destinations.');
            showToast('All points cleared.');
        }

        // Primary Action: Fly to Locations (1-click automated launch)
        async function flyToLocations() {
            if (waypoints.length === 0) {
                showToast('Please click on the map to select destination points first!', 'error');
                setHint('⚠️ Click anywhere on the map to place at least one location point.');
                return;
            }

            const startBtn = document.getElementById('btn-start');
            startBtn.disabled = true;
            startBtn.innerHTML = '<span>⏳</span> <span>Launching...</span>';
            setHint('Initiating takeoff and uploading flight coordinates...');

            // 1. Ensure simulation engine is running
            if (!isSimRunning) {
                socket.emit('start_simulation', { speed: currentSpeedMultiplier, scenario: 'normal' });
                await new Promise(r => setTimeout(r, 600));
            }

            // 2. Upload Waypoints to Flight Controller
            const payload = waypoints.map((wp, i) => ({
                sequence: i,
                latitude: wp.lat,
                longitude: wp.lng,
                altitude: wp.alt || selectedAltitude,
                waypoint_type: 'NAVIGATE'
            }));
            socket.emit('upload_mission', { waypoints: payload });

            // 3. Force Arm Drone
            socket.emit('arm_drone', { force: true });
            await new Promise(r => setTimeout(r, 400));

            // 4. Start Autonomous Mission
            socket.emit('start_mission');

            setStatusBadge('flying', 'FLYING');
            setHint(`Drone airborne! Flying to locations at ${selectedAltitude}m altitude.`);
            document.getElementById('btn-rth').disabled = false;
            document.getElementById('btn-land').disabled = false;
            document.getElementById('btn-pause').disabled = false;
        }

        // Pause / Resume (Loiter in mid-air)
        function togglePauseMission() {
            if (!isFlying || isLanding || isReturning) return;

            const btn = document.getElementById('btn-pause');
            if (!isPaused) {
                socket.emit('pause_mission');
                isPaused = true;
                btn.innerHTML = '<span>▶️</span> <span>Resume</span>';
                btn.classList.add('active-pause');
                setStatusBadge('ready', 'HOLDING (PAUSED)');
                setHint('Drone holding position in mid-air (Loiter). Click Resume to continue.');
                showToast('Mission paused — holding position.');
            } else {
                socket.emit('resume_mission');
                isPaused = false;
                btn.innerHTML = '<span>⏸️</span> <span>Pause</span>';
                btn.classList.remove('active-pause');
                setStatusBadge('flying', 'FLYING');
                setHint('Mission resumed. Continuing to next destination.');
                showToast('Mission resumed.');
            }
        }

        // Return to Home (RTH) Action
        function returnToHome() {
            isLanding = false;
            isReturning = true;
            isPaused = false;
            socket.emit('return_to_home');
            setStatusBadge('returning', 'RETURNING HOME');
            setHint('RTH active: Drone aborting path and returning to home base.');
            showToast('Returning to home base...');
            document.getElementById('btn-rth').disabled = true;
            document.getElementById('btn-pause').disabled = true;
            updateMissionMetrics();
        }

        // Land Action
        function landNow() {
            isLanding = true;
            isReturning = false;
            isPaused = false;
            socket.emit('start_landing', { mode: 'normal' });
            setStatusBadge('returning', 'LANDING');
            setHint('Descending smoothly to ground level at current location.');
            showToast('Landing initiated.');
            document.getElementById('btn-land').disabled = true;
            document.getElementById('btn-pause').disabled = true;
        }

        // Update UI Status Badge
        function setStatusBadge(type, text) {
            const badge = document.getElementById('flight-status-badge');
            const txt = document.getElementById('flight-status-text');
            badge.className = `status-badge ${type}`;
            txt.textContent = text;
        }

        // Update Bottom Hint Message
        function setHint(msg) {
            document.getElementById('hint-msg').textContent = msg;
        }

        // Toast Messages
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast-msg');
            toast.textContent = msg;
            toast.style.display = 'flex';
            if (type === 'warning') {
                toast.style.borderColor = 'rgba(245, 158, 11, 0.6)';
            } else {
                toast.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            }
            clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 3200);
        }

        // Socket Event: Telemetry Updates (10 Hz)
        socket.on('drone_state', function(state) {
            if (!state || !state.position) return;

            isSimRunning = true;
            isFlying = state.is_flying || false;
            isArmed = state.is_armed || false;

            // Update Drone Position & Orientation on Map
            const lat = state.position.lat;
            const lon = state.position.lon;
            const alt = state.position.alt || 0;
            const heading = (state.gps && state.gps.heading) || 0;
            const speed = (state.gps && state.gps.speed) || 0;
            const battery = state.battery != null ? state.battery : 100;
            const sats = (state.gps && state.gps.satellites) || 10;

            latestDronePosition = { lat: lat, lng: lon };
            droneMarker.setLatLng([lat, lon]);

            // Rotate drone icon to match heading
            const iconEl = document.getElementById('drone-icon-el');
            if (iconEl) {
                iconEl.style.transform = `rotate(${heading}deg)`;
            }

            // Update Telemetry Bar
            document.getElementById('hud-battery').textContent = `${Math.round(battery)}%`;
            document.getElementById('hud-altitude').textContent = `${alt.toFixed(1)} m`;
            document.getElementById('hud-speed').textContent = `${speed.toFixed(1)} m/s`;
            document.getElementById('hud-satellites').textContent = `${sats} Sats (3D)`;

            // Update Live Mission Distance & ETA
            updateMissionMetrics();

            // Smart Low-Battery Safety Check (Frontend fallback / visual indicator)
            if (battery <= 20.0 && isFlying && !isReturning && !isLanding && !lowBatteryTriggered) {
                lowBatteryTriggered = true;
                returnToHome();
                setStatusBadge('warning', 'LOW BATT AUTO-RTH');
                setHint(`⚠️ Low Battery (${battery.toFixed(1)}%)! Emergency Auto-RTH initiated.`);
                showToast(`⚠️ Low Battery (${battery.toFixed(1)}%)! Returning home now.`, 'warning');
                document.querySelector('.telemetry-bar').classList.add('low-battery-alert');
            }

            // Update Controls State
            document.getElementById('btn-rth').disabled = !isFlying || isLanding;
            document.getElementById('btn-land').disabled = !isFlying || isLanding;
            document.getElementById('btn-pause').disabled = !isFlying || isLanding || isReturning;

            if (isFlying) {
                if (state.is_returning_home || isReturning) {
                    if (battery <= 20.0) {
                        setStatusBadge('warning', 'LOW BATT AUTO-RTH');
                    } else {
                        setStatusBadge('returning', 'RETURNING HOME');
                    }
                } else if (isPaused) {
                    setStatusBadge('ready', 'HOLDING (PAUSED)');
                } else {
                    setStatusBadge('flying', 'FLYING');
                }
            } else if (isArmed) {
                setStatusBadge('ready', 'ARMED');
            } else {
                setStatusBadge('disarmed', 'DISARMED');
            }
        });

        // Socket Event: Low Battery Auto-RTH from Backend
        socket.on('low_battery_rth', function(data) {
            if (!isReturning && !isLanding) {
                lowBatteryTriggered = true;
                isReturning = true;
                isPaused = false;
                setStatusBadge('warning', 'LOW BATT AUTO-RTH');
                setHint(`⚠️ ${data.message}`);
                showToast(`⚠️ ${data.message}`, 'warning');
                document.getElementById('btn-rth').disabled = true;
                document.getElementById('btn-pause').disabled = true;
                document.querySelector('.telemetry-bar').classList.add('low-battery-alert');
            }
        });

        // Socket Event: Waypoint Reached
        socket.on('waypoint_reached', function(data) {
            if (isLanding) return;
            const idx = data.index || 0;
            const pin = document.getElementById(`wp-pin-${idx}`);
            if (pin) {
                pin.classList.add('reached');
            }
            if (waypoints[idx - 1]) {
                waypoints[idx - 1].reached = true;
            }
            updateMissionMetrics();
            if (!isReturning && idx <= waypoints.length) {
                setHint(`Reached Point ${idx} of ${waypoints.length}! Continuing mission...`);
                showToast(`Point ${idx} reached`);
            }
        });

        // Socket Event: Mission Completed
        socket.on('mission_completed', function() {
            if (isLanding) return;
            setStatusBadge('ready', 'MISSION COMPLETE');
            setHint('All destination points completed! Click "Return to Home" or add new points.');
            showToast('Mission completed successfully!');
            const startBtn = document.getElementById('btn-start');
            startBtn.disabled = false;
            startBtn.innerHTML = '<span>🚀</span> <span>Fly to Locations</span>';
            document.getElementById('btn-pause').disabled = true;
        });

        // Socket Event: Touchdown / Landed
        socket.on('landed', function() {
            isFlying = false;
            isReturning = false;
            isLanding = false;
            isPaused = false;
            lowBatteryTriggered = false;

            setStatusBadge('disarmed', 'LANDED');
            setHint('Drone landed safely. Ready for new mission.');
            showToast('Drone safely on the ground.');

            const startBtn = document.getElementById('btn-start');
            startBtn.disabled = false;
            startBtn.innerHTML = '<span>🚀</span> <span>Fly to Locations</span>';

            const pauseBtn = document.getElementById('btn-pause');
            pauseBtn.disabled = true;
            pauseBtn.innerHTML = '<span>⏸️</span> <span>Pause</span>';
            pauseBtn.classList.remove('active-pause');

            document.getElementById('btn-rth').disabled = true;
            document.getElementById('btn-land').disabled = true;
            document.querySelector('.telemetry-bar').classList.remove('low-battery-alert');
        });

        // Auto-start simulation engine on connection so map is live immediately
        socket.on('connect', function() {
            socket.emit('start_simulation', { speed: currentSpeedMultiplier, scenario: 'normal' });
        });
    </script>
</body>
</html>
